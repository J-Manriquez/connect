org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Workaround temporal: en este equipo Windows Defender bloquea momentaneamente
# los metadata.bin recien escritos del transform cache cuando Gradle los lee
# en paralelo ("Could not read workspace metadata ... metadata.bin"). Bajar
# la concurrencia evita la condicion de carrera con el antivirus.
org.gradle.parallel=false
org.gradle.workers.max=1
# El snapshot de file-system watching (VFS) de Gradle quedo corrupto en este
# equipo: un daemon nuevo lo recargaba ya invalido y fallaba al instante
# referenciando transforms que ya no existian en disco. Desactivarlo evita
# que se vuelva a corromper.
org.gradle.vfs.watch=false
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
